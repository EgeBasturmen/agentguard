[project]
name = "agentguard"
version = "0.1.0"
description = "Regression and side-effect testing infrastructure for AI agents"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0"
]

[project.scripts]
agentguard = "agentguard.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"agentguard.demo.fixtures" = ["*.yaml"]