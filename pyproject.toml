[project]
name = "agentguard"
version = "0.1.0"
description = "Regression and side-effect testing infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[project.scripts]
agentguard = "agentguard.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers"
filterwarnings = ["error::RuntimeWarning"]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "unit: isolated model, evaluator and component tests",
    "integration: CLI, filesystem/report and subprocess integration tests",
    "docker: requires a running Docker daemon and worker images",
]

[tool.setuptools.package-data]
"agentguard.demo.fixtures" = ["*.yaml"]
