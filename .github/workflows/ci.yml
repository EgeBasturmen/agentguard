name: Phase 1 validation

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  tests-and-wheel:
    needs: workflow-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Unit tests
        run: python -m pytest -q -m unit --junitxml=artifacts/unit.xml
      - name: Integration tests
        if: ${{ !cancelled() }}
        run: python -m pytest -q -m integration --junitxml=artifacts/integration.xml
      - name: Build sdist and wheel in isolated build environments
        run: python -m build
      - name: Install only the built wheel in a clean runtime and test its console CLI
        run: python scripts/check_wheel.py dist --result artifacts/wheel-check.json
      - name: Retain test and package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/
            dist/
          retention-days: 7
          if-no-files-found: warn

  phase1-gate:
    name: Phase 1 gate
    if: always()
    needs: [workflow-lint, tests-and-wheel, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
          TEST_MATRIX_RESULT: ${{ needs.tests-and-wheel.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$WORKFLOW_RESULT" = success
          test "$TEST_MATRIX_RESULT" = success
          test "$DOCKER_RESULT" = success

  docker:
    needs: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip ".[dev]"
      - name: Require working Docker daemon
        run: docker info
      - name: Build current worker and prepare timeout fixture image
        run: |
          docker build -f docker/Dockerfile.worker -t agentguard-worker:dev .
          docker pull python:3.11-slim
      - name: Real Docker agents, connectors, approved generated scenarios and isolation tests (no skips)
        run: python -m pytest -q -m docker --junitxml=artifacts/docker.xml
      - name: Build distribution and verify execution, integrations and generation lifecycle from a clean wheel
        run: |
          python -m build --outdir artifacts/dist
          python scripts/check_wheel.py artifacts/dist --docker --result artifacts/docker-wheel-check.json
      - name: Retain Docker test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-validation
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
